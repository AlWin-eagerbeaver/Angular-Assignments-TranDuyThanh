<table border="1" style="width: 100%; border-collapse: collapse; margin-top: 15px;">
  <thead>
    <tr style="background-color: white; color: black;">
      <th>Id</th>
      <th>Name</th>
      <th>Email</th>
      <th>Age</th>
      <th>#</th>
    </tr>
  </thead>
  
  <ng-container *ngFor="let group of customerGroups">
    <tr>
      <td colspan="5" style="padding: 10px;">
        <b>Nhóm: {{group.CustomerTypeId}} - {{group.CustomterTypeName}}</b>
      </td>
    </tr>
    
    <tr *ngFor="let cus of group.Customers" style="text-align: center;">
      <td>{{cus.Id}}</td>
      <td>{{cus.Name}}</td>
      <td>{{cus.Email}}</td>
      <td>{{cus.Age}}</td>
      <td>
        <img [src]="cus.Image" alt="avatar" width="100" height="100" >
      </td>
    </tr>
  </ng-container>
</table>
